version: 1

notes:
  - These latent cases and semantic answer keys are authored before classifier implementation.
  - Natural-language descriptions are intentionally absent at this stage.
  - A renderer may receive only form + seed, never expected + rationale.
  - Rendered descriptions must be reviewed for fidelity and then frozen before classifier tuning.
  - Cohort frequencies are stress-weighted and do not estimate Meridian's production case mix.

cases:
  - id: S01
    cohort: straightforward
    form:
      industry: B2B software
      company_size: small
      urgency: normal
    seed:
      requested_outcome: Compare two adjacent markets and recommend which one the company should enter.
      facts:
        - The client wants a bounded strategic assessment and recommendation.
        - No implementation, system build, or operating redesign is requested.
        - One leadership workshop is expected at the end.
      rendering_style: concise executive; uses ordinary business language
    expected:
      disposition: clear
      service_line: strategy_transformation
      complexity: simple
      alternative_service_lines: []
    rationale: The requested product is a focused strategic choice with one bounded deliverable.
    tags: [bounded, strategy, small_company]

