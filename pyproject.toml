[project]
name = "meridian"
version = "0.0.0"
description = "AIVC intake triage case study for the fictional Meridian Advisory"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "openai>=2,<3",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "uvicorn>=0.30,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

# Bound workspace discovery here; the enclosing ~/life project is independent.
[tool.uv.workspace]
members = []
